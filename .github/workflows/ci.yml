name: CI

# What the build takes from outside, and how each is pinned (a pandoc bump
# also updates some: the list at the top of pins.env):
#   - actions: by commit, the version beside it (.github/dependabot.yml
#     proposes updates weekly);
#   - container images: by digest, the tag beside it. Dependabot updates
#     Dockerfiles' images, not these: a newer one is looked up by hand
#     (e.g. curl -sI -H "Authorization: Bearer $(curl -s
#     'https://quay.io/v2/auth?service=quay.io&scope=repository:pypa/IMAGE:pull'
#     | jq -r .token)" -H 'Accept: application/vnd.oci.image.index.v1+json,
#     application/vnd.docker.distribution.manifest.v2+json'
#     https://quay.io/v2/pypa/IMAGE/manifests/TAG: docker-content-digest);
#   - GHC, cabal, ghcup, ghc-wasm-meta: pins.env, checked by SHA-256 or
#     by commit (scripts/manylinux.sh, scripts/build-wasm.sh); on macOS and
#     Windows, haskell-actions/setup installs the pinned versions;
#   - Haskell packages: Hackage at INDEX_STATE (cabal checks the index's
#     signatures and each package's hash); the wasm build's git packages
#     by commit (cabal-wasm.project);
#   - npm: wasm/package-lock.json (npm ci); Pyodide, Playwright (whose
#     version fixes its browsers' builds) and esbuild by exact version;
#   - the runners' images, Homebrew, apt and the containers' dnf and apk
#     packages: not pinned (signed repositories, the runner's versions);
#   - libpandoc-rs, libpandoc-python, panir and panclude: cloned at their
#     HEAD on purpose, as the integration tests of the owner's own
#     repositories (panclude: its conformance cases, test/panclude.mjs).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: libpandoc (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - subdir: linux-64
            os: ubuntu-24.04
            image: manylinux_2_28
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.11.14-1@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
          - subdir: linux-aarch64
            os: ubuntu-24.04-arm
            image: manylinux_2_28
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.11.14-1@sha256:34a5e614a4eb26f73f8bf44cbbf2acf8011620453d03ea35a58537bb3cde44de
          # musl (Alpine and the like): for musllinux wheels
          - subdir: linux-64-musl
            os: ubuntu-24.04
            image: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64:2026.11.14-1@sha256:c564755a06228cc28fe8383fc5fde4468f6cea91b9d35a38eaf853018bb3b320
          - subdir: linux-aarch64-musl
            os: ubuntu-24.04-arm
            image: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64:2026.11.14-1@sha256:202c3e7e9a872d4e8d712621d3f63f02e4760a9b958679506841c452ad91f959
          - { subdir: osx-64, os: macos-15-intel }
          - { subdir: osx-arm64, os: macos-15 }
          - { subdir: win-64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pins
        run: grep -E '^[A-Z0-9_]+=' pins.env >> "$GITHUB_ENV"

      # Linux builds in a manylinux or musllinux container instead
      # (scripts/manylinux.sh)
      - name: Set up GHC
        if: runner.os != 'Linux'
        id: ghc
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Install native tools
        run: |
          case "$RUNNER_OS" in
            macOS) brew install gmp ;;
          esac

      - name: Locate cabal store
        id: store
        env:
          CABAL_STORE: ${{ steps.ghc.outputs.cabal-store }}
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            # ghcup and the cabal store of the container
            echo "path=$HOME/manylinux-cache" >> "$GITHUB_OUTPUT"
          else
            echo "path=$CABAL_STORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-${{ env.INDEX_STATE }}-${{ hashFiles('libpandoc.cabal', 'cabal.project', 'scripts/build.sh') }}
          restore-keys: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-

      - name: Build (${{ matrix.image }} container)
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          mkdir -p "$HOME/manylinux-cache"
          docker run --rm -v "$PWD:/work" -v "$HOME/manylinux-cache:/cache" -w /work \
            -e CABALOPTS=-j -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE" bash scripts/manylinux.sh dist

      - name: Build
        if: runner.os != 'Linux'
        env:
          CABALOPTS: -j
          # Homebrew's gmp, for GHC's bignum library
          CABAL_PROJECT_EXTRA: "${{ runner.os == 'macOS' && 'extra-lib-dirs: /opt/homebrew/lib /usr/local/lib' || '' }}"
        run: bash scripts/build.sh dist

      - name: Save cabal store
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # On Linux this also checks portability: built against glibc 2.28, run
      # on the runner's Ubuntu; musl's, in a plain Alpine (no GHC, no -dev
      # packages: the libraries it bundles and the system's own only).
      # the smoke test, then the sandbox (citeproc), untrusted (the data
      # directory), edge-case, time-limit, threads, cancel
      # and include step (panclude) tests
      - name: Tests (C, musl)
        if: matrix.image == 'musllinux_1_2'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf sh -c '
            apk add -q gcc musl-dev gmp zlib libffi libstdc++ &&
            for t in smoke sandbox untrusted edge limits threads cancel panclude; do
              cc -Wall -pthread -o dist/$t test/$t.c -Idist/include -Ldist/lib -lpandoc -Wl,-rpath,"\$ORIGIN/lib" || exit 1
            done &&
            dist/smoke dist/share/libpandoc/api-version.json && dist/sandbox && dist/untrusted && dist/edge && dist/limits && dist/threads && dist/cancel && dist/panclude &&
            rm dist/smoke dist/sandbox dist/untrusted dist/edge dist/limits dist/threads dist/cancel dist/panclude'

      - name: Tests (C)
        if: matrix.image != 'musllinux_1_2'
        run: |
          for t in smoke sandbox untrusted edge limits threads cancel panclude; do
            case "$RUNNER_OS" in
              Linux)   cc -Wall -pthread -o dist/$t test/$t.c -Idist/include -Ldist/lib -lpandoc -Wl,-rpath,'$ORIGIN/lib' ;;
              macOS)   cc -Wall -pthread -o dist/$t test/$t.c -Idist/include -Ldist/lib -lpandoc -Wl,-rpath,@executable_path/lib ;;
              Windows) gcc -Wall -o dist/bin/$t.exe test/$t.c -Idist/include dist/bin/pandoc.dll ;;
            esac
          done
          if [[ $RUNNER_OS == Windows ]]; then
            (cd dist/bin && ./smoke.exe ../share/libpandoc/api-version.json && ./sandbox.exe && ./untrusted.exe && ./edge.exe && ./limits.exe && ./threads.exe && ./cancel.exe && ./panclude.exe)
            rm dist/bin/smoke.exe dist/bin/sandbox.exe dist/bin/untrusted.exe dist/bin/edge.exe dist/bin/limits.exe dist/bin/threads.exe dist/bin/cancel.exe dist/bin/panclude.exe
          else
            dist/smoke dist/share/libpandoc/api-version.json
            dist/sandbox
            dist/untrusted
            dist/edge
            dist/limits
            dist/threads
            dist/cancel
            dist/panclude
            rm dist/smoke dist/sandbox dist/untrusted dist/edge dist/limits dist/threads dist/cancel dist/panclude
          fi

      # panclude's conformance cases against the include step built in
      # (test/panclude.mjs), through pandoc_main (test/command.c). panclude
      # at its HEAD on purpose (the owner's own)
      - name: panclude's cases
        if: matrix.subdir == 'linux-64' || runner.os == 'macOS'
        run: |
          case "$RUNNER_OS" in
            Linux) cc -Wall -o dist/command test/command.c -Idist/include -Ldist/lib -lpandoc -Wl,-rpath,'$ORIGIN/lib' ;;
            macOS) cc -Wall -o dist/command test/command.c -Idist/include -Ldist/lib -lpandoc -Wl,-rpath,@executable_path/lib ;;
          esac
          git clone --depth 1 --branch builtin-cases https://github.com/ickc/panclude "$RUNNER_TEMP/panclude"
          node --version
          PANCLUDE="$RUNNER_TEMP/panclude" LIBPANDOC_COMMAND="$PWD/dist/command" node --test test/panclude.mjs
          rm dist/command

      - name: Show size
        run: |
          du -sh dist
          if [[ -d dist/lib/libpandoc ]]; then echo "$(find dist/lib/libpandoc -type f | wc -l) bundled libraries"; fi

      - name: Archive
        env:
          SUBDIR: ${{ matrix.subdir }}
        run: tar -czf "libpandoc-$SUBDIR.tar.gz" -C dist .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libpandoc-${{ matrix.subdir }}
          path: libpandoc-${{ matrix.subdir }}.tar.gz

  # libpandoc.wasm (wasm/README.md), tested in Node, Pyodide and browsers
  wasm:
    name: libpandoc.wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pins
        run: grep -E '^[A-Z0-9_]+=' pins.env >> "$GITHUB_ENV"

      - name: Restore wasm cabal store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: cabal-wasm-${{ env.GHC_WASM_META_REV }}-${{ env.INDEX_STATE }}-${{ hashFiles('cabal-wasm.project', 'libpandoc.cabal') }}
          restore-keys: cabal-wasm-${{ env.GHC_WASM_META_REV }}-

      # build tools some dependencies need at configure time (pretty-show,
      # toml-parser), as in pandoc-forge
      - name: Install alex and happy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends alex happy

      - name: Build
        run: bash scripts/build-wasm.sh dist/wasm

      - name: Save wasm cabal store
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Node from the toolchain: GHC's wasm needs a recent V8 (not Node 22)
      - name: Test in Node
        run: |
          source ~/.ghc-wasm/env
          node --version
          (cd wasm && npm ci)
          node --test wasm/test.mjs

      # panclude's conformance cases against the include step, pandoc_main in
      # libpandoc.wasm (test/panclude.mjs). panclude at its HEAD on purpose
      # (the owner's own)
      - name: panclude's cases in Node
        run: |
          source ~/.ghc-wasm/env
          git clone --depth 1 --branch builtin-cases https://github.com/ickc/panclude "$RUNNER_TEMP/panclude"
          PANCLUDE="$RUNNER_TEMP/panclude" node --test test/panclude.mjs

      # Rust filters compiled to wasm (libpandoc-rs's examples, WASI
      # commands) inside a conversion, run by the JS engine. libpandoc-rs at
      # its HEAD on purpose (the owner's own; its Cargo.lock pins its crates)
      - name: Test wasm filters in Node
        run: |
          source ~/.ghc-wasm/env
          rustup target add wasm32-wasip1
          git clone --depth 1 https://github.com/ickc/libpandoc-rs "$RUNNER_TEMP/libpandoc-rs"
          (cd "$RUNNER_TEMP/libpandoc-rs/filters" && cargo build --release --target wasm32-wasip1)
          echo "WASM_FILTERS=$RUNNER_TEMP/libpandoc-rs/filters/target/wasm32-wasip1/release" >> "$GITHUB_ENV"
          (cd wasm && npm ci)
          WASM_FILTERS="$RUNNER_TEMP/libpandoc-rs/filters/target/wasm32-wasip1/release" node --test wasm/test-wasm-filter.mjs
          # pandoc_main, a wasm filter on its command line too
          WASM_FILTERS="$RUNNER_TEMP/libpandoc-rs/filters/target/wasm32-wasip1/release" node --test wasm/test-main.mjs

      - name: Test in Pyodide
        run: |
          source ~/.ghc-wasm/env
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide"
          npm init -y >/dev/null && npm install pyodide@314.0.8
          # panir at its HEAD on purpose (the owner's own)
          python3 -m pip wheel --no-deps -w wheels "panir @ git+https://github.com/ickc/panir#subdirectory=python"
          cd "$GITHUB_WORKSPACE"
          PYODIDE="$RUNNER_TEMP/pyodide" PANIR_WHEEL=$(ls "$RUNNER_TEMP"/pyodide/wheels/panir-*.whl) node wasm/test-pyodide.mjs

      # libpandoc-python's own tests, on its Pyodide backend, with Python and
      # pandoc sharing Pyodide's filesystem as in a browser; the three that
      # need threads are expected to fail. libpandoc-python at its HEAD on
      # purpose (the owner's own)
      - name: libpandoc-python's tests in Pyodide
        run: |
          source ~/.ghc-wasm/env
          (cd wasm && npm ci)
          git clone --depth 1 https://github.com/ickc/libpandoc-python "$RUNNER_TEMP/libpandoc-python"
          set +e
          SHIM=1 PYODIDE="$RUNNER_TEMP/pyodide" PANIR_WHEEL=$(ls "$RUNNER_TEMP"/pyodide/wheels/panir-*.whl) \
            LIBPANDOC_PYTHON="$RUNNER_TEMP/libpandoc-python" node wasm/test-pyodide-suite.mjs tests/test_api.py tests/test_ast.py \
            --deselect tests/test_api.py::test_threads \
            --deselect tests/test_api.py::test_num_threads \
            --deselect tests/test_api.py::test_num_threads_from_the_environment
          status=$?
          set -e
          exit $status

      # the JS libpandoc-python's wheel for Pyodide carries (wasm/pyodide.mjs)
      - name: Bundle for Pyodide
        run: |
          source ~/.ghc-wasm/env
          bash scripts/bundle-pyodide.sh dist/wasm

      - name: Test in browsers (Chromium, Firefox, WebKit)
        run: |
          mkdir -p "$RUNNER_TEMP/browsers" && cd "$RUNNER_TEMP/browsers"
          npm init -y >/dev/null && npm install playwright@1.65.1 @bjorn3/browser_wasi_shim@0.4.2
          npx playwright install --with-deps chromium firefox webkit
          cd "$GITHUB_WORKSPACE"
          NODE_MODULES="$RUNNER_TEMP/browsers/node_modules" node wasm/test-browser.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-libpandoc
          path: |
            dist/wasm/libpandoc.wasm
            dist/wasm/libpandoc-pyodide.mjs
            dist/wasm/libpandoc-wasm-THIRD-PARTY-NOTICES.txt

  # Every push to main replaces the assets of the `continuous` pre-release,
  # which downstream CI (libpandoc-python) downloads: the native builds
  # (each with its THIRD-PARTY-NOTICES), libpandoc.wasm, its notices and its
  # bundled JS for Pyodide; with SHA256SUMS, and a
  # build provenance attestation of each (README: "Verifying a download").
  # Only from main (not from pull requests, forks' included), one run at a
  # time in order (the workflow's concurrency, and this job's).
  publish:
    needs: [build, wasm]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-continuous
      cancel-in-progress: false
    permissions:
      contents: write # the release
      id-token: write # the attestation's signing certificate (Sigstore)
      attestations: write # the attestation, stored with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libpandoc-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-libpandoc
      - name: Checksums
        run: |
          sha256sum libpandoc-*.tar.gz libpandoc.wasm libpandoc-pyodide.mjs libpandoc-wasm-THIRD-PARTY-NOTICES.txt > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            libpandoc-*.tar.gz
            libpandoc.wasm
            libpandoc-pyodide.mjs
            libpandoc-wasm-THIRD-PARTY-NOTICES.txt
            SHA256SUMS
      # SHA256SUMS last: while the assets are being replaced, a download
      # checked against it fails rather than passes
      - name: Upload to the continuous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view continuous >/dev/null 2>&1 ||
            gh release create continuous --prerelease --title continuous \
              --notes "Latest build of main. Replaced on every push. Verify a download: README.md, \"Verifying a download\"."
          gh release upload continuous libpandoc-*.tar.gz libpandoc.wasm libpandoc-pyodide.mjs \
            libpandoc-wasm-THIRD-PARTY-NOTICES.txt --clobber
          gh release upload continuous SHA256SUMS --clobber
